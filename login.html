{% extends "base.html" %}
{% block title %}Кіру{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Сейфке кіру</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Логин <input name="username" required autofocus autocomplete="username"></label>
    <label>Master пароль <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Кіру</button>
  </form>
  <p class="hint">Аккаунтыңыз жоқ па? <a href="{{ url_for('register') }}">Тіркелу</a></p>
</section>
{% endblock %}
